apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: reops-clean-to-enriched
  namespace: team-researchops
  labels:
    team: team-researchops
spec:
  image: "{{ image }}"
  port: 8080
  liveness:
    path: /internal/health
    initialDelay: 90
    periodSeconds: 10
    timeout: 5
    failureThreshold: 3
  readiness:
    path: /internal/health
    initialDelay: 20
    periodSeconds: 5
    timeout: 5
    failureThreshold: 14
  replicas:
    min: 2
    max: 4
    scalingStrategy:
      kafka:
        topic: team-researchops.analytics-clean
        consumerGroup: reops-clean-to-enriched
        threshold: 100
      cpu:
        thresholdPercentage: 90
  prometheus:
    enabled: true
    path: /internal/prometheus
  resources:
    limits:
      memory: 1536Mi
    requests:
      cpu: "200m"
      memory: 1024Mi
  kafka:
    pool: nav-dev
  gcp:
    sqlInstances:
      - type: POSTGRES_18
        tier: db-f1-micro
        databases:
          - name: reops-clean-to-enriched
  azure:
    application:
      enabled: true
      tenant: nav.no
      # Permit delegated Nav users; API code still checks caller, team and ownership.
      allowAllUsers: true
  accessPolicy:
    inbound:
      rules:
        - application: reops-innblikk-frontend
          namespace: team-researchops
    outbound:
      rules:
        - application: reops-innblikk-frontend
          namespace: team-researchops
      external:
        - host: nav-dev-kafka-nav-dev.aivencloud.com
        - host: teamkatalog-api.intern.nav.no
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: kubernetes
    - name: JAVA_TOOL_OPTIONS
      value: >-
        -XX:+UseZGC
        -XX:MaxRAMPercentage=70
        -XX:InitialRAMPercentage=50
        -XX:+ExitOnOutOfMemoryError
  strategy:
    type: Recreate
  envFrom:
    - secret: reops-event-proxy
