apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: reops-clean-to-enriched
  namespace: team-researchops
  labels:
    team: team-researchops
spec:
  image: "{{ image }}"
  port: 8080
  liveness:
    path: /internal/health
    initialDelay: 30
  readiness:
    path: /internal/health
    initialDelay: 5
  replicas:
    min: 2
    max: 10
    scalingStrategy:
       kafka:
        topic: team-researchops.analytics-clean
        consumerGroup: reops-clean-to-enriched
        threshold: 100
  prometheus:
    enabled: true
    path: /internal/prometheus
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: "400m"
      memory: 124Mi
  kafka:
    pool: nav-prod
  gcp:
    sqlInstances:
      - type: POSTGRES_18
        tier: db-f1-micro
        databases:
          - name: reops-clean-to-enriched
  accessPolicy:
    outbound:
      external:
        - host: nav-prod-kafka-nav-prod.aivencloud.com
  ingresses:
    - "https://reops-clean-to-enriched.ansatt.nav.no"
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: kubernetes
    - name: JAVA_TOOL_OPTIONS
      value: >-
        -XX:+UseZGC
        -XX:MaxRAMPercentage=70
        -XX:InitialRAMPercentage=50
        -XX:+ExitOnOutOfMemoryError
  strategy:
    type: Recreate
  envFrom:
    - secret: reops-event-proxy
