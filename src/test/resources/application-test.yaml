spring:
  application:
    name: reops-clean-to-enriched-test
  kafka:
    topic: test-topic
    output-topic: test-output-topic
    website-topic: test-website-topic
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    retry:
      backoff-delay: 1000
    consumer:
      group-id: test-group
  datasource:
    url: jdbc:h2:mem:testdb-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none

app:
  secret: test-secret

logging:
  level:
    root: ERROR
    no.nav.reops: INFO