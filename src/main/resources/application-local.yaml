spring:
  kafka:
    bootstrap-servers: localhost:9094
    topic: clean
    output-topic: enriched
    website-topic: website
    properties:
      security.protocol: PLAINTEXT
    retry:
      backoff-delay: 1000
  security:
    oauth2:
      resourceserver:
        jwt:
          # No real IdP locally: management API stays protected, tokens must be signed by
          # a key served here (e.g. a local mock-oauth2-server).
          jwk-set-uri: http://localhost:8081/default/jwks
  datasource:
    url: jdbc:postgresql://localhost:5432/reops-clean-to-enriched
    username: reops-clean-to-enriched
    password: reops-clean-to-enriched
server:
  port: 8088

app:
  secret: kake

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    no.nav.reops: TRACE
    org.springframework.web.reactive.function.client.ExchangeFunctions: DEBUG
    reactor.netty.http.client: DEBUG
    org.apache.kafka.clients.NetworkClient: WARN
    org.apache.kafka.clients.Metadata: WARN