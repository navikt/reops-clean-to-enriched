spring:
  application:
    name: reops-clean-to-enriched
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 16
        jdbc:
          batch_size: 16
        order_inserts: true
        order_updates: true
  kafka:
    bootstrap-servers: localhost:9094
    website-topic: website
    listener:
      ack-mode: batch
      concurrency: 3
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      group-id: reops-clean-to-enriched
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.value.default.type: no.nav.reops.event.Event
        spring.json.trusted.packages: "*"
        max.poll.records: 500
        max.poll.interval.ms: 300000
        fetch.max.bytes: 1048576  # 1 MB
        fetch.min.bytes: 1
        fetch.max.wait.ms: 100
  main:
    banner-mode: off
    web-application-type: reactive
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  netty:
    connection-timeout: 5s
    threads: 5

management:
  endpoints:
    web:
      base-path: /internal/
      exposure:
        include: info, health, metrics, prometheus

app:
  secret: ${APP_SECRET:}

logging:
  level:
    root: INFO
    org.springframework.web: WARN
    no.nav.reops: INFO
    org.springframework.web.reactive.function.client.ExchangeFunctions: WARN
    reactor.netty.http.client: WARN
    org.apache.kafka.clients.NetworkClient: WARN
    org.apache.kafka.clients.Metadata: WARN
    org.apache.kafka.common.config.AbstractConfig: WARN

