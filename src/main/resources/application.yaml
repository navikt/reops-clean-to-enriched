spring:
  application:
    name: reops-clean-to-enriched
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 16
        jdbc:
          batch_size: 16
        order_inserts: true
        order_updates: true
  kafka:
    bootstrap-servers: localhost:9094
    website-topic: website
    listener:
      ack-mode: batch
      concurrency: 3
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      group-id: reops-clean-to-enriched
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: no.nav.reops.event.Event
        spring.json.trusted.packages: "*"
        max.poll.records: 500
        max.poll.interval.ms: 300000
        fetch.max.bytes: 1048576  # 1 MB
        fetch.min.bytes: 1
        fetch.max.wait.ms: 100
  main:
    banner-mode: off
    web-application-type: reactive
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  netty:
    connection-timeout: 5s
    threads: 5

management:
  endpoints:
    web:
      base-path: /internal/
      exposure:
        include: info, health, metrics, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        spring.kafka.listener: true

app:
  secret: ${APP_SECRET:}
  reops-team-id: 26dba481-fd96-40a8-b47d-b1ad0002bc74
  team-catalog:
    # Team Catalog has a single stable instance (teamkatalog.nav.no); its data is openly
    # readable inside Nav and the "dev" API is teamkatalog-team's own sandbox, not a
    # mirror — so both clusters use the same base URL.
    base-url: https://teamkatalog-api.intern.nav.no
  security:
    # Nais-injected JSON of azure.application.preAuthorizedApps
    # ([{name:"<cluster>:<namespace>:<app>",clientId:"<uuid>"}]). The azp validator
    # resolves the Innblikk BFF client id from this at runtime — no manual config.
    pre-authorized-apps-json: ${AZURE_APP_PRE_AUTHORIZED_APPS:}

logging:
  level:
    root: INFO
    org.springframework.web: WARN
    no.nav.reops: INFO
    org.springframework.web.reactive.function.client.ExchangeFunctions: WARN
    reactor.netty.http.client: WARN
    org.apache.kafka.clients.NetworkClient: WARN
    org.apache.kafka.clients.Metadata: WARN
    org.apache.kafka.common.config.AbstractConfig: WARN

