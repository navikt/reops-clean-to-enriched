spring:
  application:
    name: reops-opensearch-test
  kafka:
    topic: test-topic
    dlt-topic: test-opensearch-dlt
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    retry:
      backoff-delay: 1000
    consumer:
      group-id: test-group
    listener:
      ack-mode: batch
      type: batch
      poll-timeout: 1000

reops:
  opensearch:
    host: localhost
    port: 9400
    index: events

logging:
  level:
    root: ERROR
    no.nav.reops: INFO